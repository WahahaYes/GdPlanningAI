mode="settle"
nodes=["CameraRig/SpringArm3D/Camera3D"]
min_counts={"GdPAIAgent": 1}

; Hungry, the agent finds fruit (shaking the tree if needed), picks it up and eats it.
[hunger_basic_2d.agent_eats]
slug="example-agents-live"
scene="res://examples/hunger_basic_2d.tscn"
mode="run"
time_scale=2.0
hunger=60.0
seconds=40.0
completes=["Pick Up Item", "Eat Held Food"]

; The agent keeps its fire fuelled and cooks dug potatoes to eat.
[campfire_2d.agent_fuels_fire_and_eats_cooked_potato]
slug="example-agents-live"
scene="res://examples/campfire_2d.tscn"
mode="run"
time_scale=2.0
hunger=60.0
seconds=40.0
completes=["Pick Up Wood", "Add Fuel", "Dig Potato", "Cook Potato", "Eat Held Food"]

; Six agents in pairs keep three fires going and eat; nobody starves.
[campfire_large_3d.pairs_keep_fires_and_eat]
slug="example-agents-live"
scene="res://examples/campfire_large_3d.tscn"
mode="run"
e2e=true
observe=true
time_scale=1.0
seconds=60.0
max_hunger_below=100.0
min_finished=1
fires_burn=true

; Several agents share the fruit trees; nobody starves.
[hunger_multi_agent_2d.agents_share_food]
slug="example-agents-live"
scene="res://examples/hunger_multi_agent_2d.tscn"
mode="run"
