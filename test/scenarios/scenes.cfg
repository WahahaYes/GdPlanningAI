; Example scenes as data, run by test/integration/test_scene_scenarios.gd. One section per case,
; named <scene>.<case>. Every case names the docs/BEHAVIORS.md slug it proves.
;
; mode="settle": agents are parked (no planning); after a few frames the scene must keep
;   `nodes` (paths) and at least `min_counts` nodes of each class.
; mode="run": agents plan normally at `time_scale` (game speed; planning stays in wall time).
;   `hunger` sets every agent's hunger first. The case passes once every action title in
;   `completes` has completed, and fails at `seconds` (wall clock) otherwise. With `observe`
;   it runs the full `seconds` at 60 fps and then checks `max_hunger_below` (no agent reached
;   it), `min_finished` (chains each agent ran to the end) and `fires_burn` (every campfire had
;   fuel during the second half).
; e2e=true cases run only in `make test-e2e` (one at a time, memory-capped).

[hunger_basic_2d.settles]
slug="example-agents-live"
scene="res://examples/hunger_basic_2d.tscn"
mode="settle"
nodes=["GdPAIWorldNode"]
min_counts={"GdPAIAgent": 1}

[hunger_multi_agent_2d.settles]
slug="example-agents-live"
scene="res://examples/hunger_multi_agent_2d.tscn"
mode="settle"
nodes=["GdPAIWorldNode"]
min_counts={"GdPAIAgent": 2}

[hunger_stress_test_2d.settles]
slug="example-agents-live"
scene="res://examples/hunger_stress_test_2d.tscn"
mode="settle"
nodes=["GdPAIWorldNode"]
min_counts={"GdPAIAgent": 5}

[campfire_2d.settles]
slug="example-agents-live"
scene="res://examples/campfire_2d.tscn"
mode="settle"
nodes=["GdPAIWorldNode"]
min_counts={"GdPAIAgent": 1, "CampfireObject": 1}

[campfire_3d.settles]
slug="example-agents-live"
scene="res://examples/campfire_3d.tscn"
mode="settle"
