# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        # Vendored binary art (glTF/PNG) is intentionally committed.
        exclude: ^examples/source_[23]d/assets/vendored/
      - id: check-merge-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Rust formatting and linting via Makefile targets
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo fmt check (via make)
        entry: make -C addons/GdPlanningAI/rust format
        language: system
        types: [rust]
        require_serial: true
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy (warnings fail, via make)
        entry: make -C addons/GdPlanningAI/rust lint
        language: system
        types: [rust]
        require_serial: true
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        verbose: true

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap=no"]
        types: [markdown]
        # Without the GFM plugin mdformat collapses tables onto one line.
        additional_dependencies: [mdformat-gfm==1.0.0]

  # Python formatting/linting for scripts
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        types: [python]
      - id: ruff-format
        types: [python]

  # GDScript formatting and style checks via Makefile
  - repo: local
    hooks:
      - id: gdformat
        name: GDScript format (via make)
        entry: make format-godot
        language: system
        types: [gdscript]
        require_serial: true
        pass_filenames: false

      - id: gdlint
        name: GDScript lint (via make)
        entry: make lint-godot
        language: system
        types: [gdscript]
        require_serial: true
        pass_filenames: false

      - id: gdlint-style
        name: GDScript/Rust style check (via make)
        entry: make lint-style
        language: system
        types_or: [gdscript, rust]
        require_serial: true
        pass_filenames: false

  # Documentation drift check (README/LICENSE between root and addon)
  - repo: local
    hooks:
      - id: check-docs
        name: Check README/LICENSE drift (via make)
        entry: make check-docs
        language: system
        files: ^(README\.md|LICENSE\.txt|addons/GdPlanningAI/(README\.md|LICENSE\.txt))$
        require_serial: true
        pass_filenames: false

  # The hub rule holds in any clone, not only ones with the hub's leak guard.
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no co-author or ai attribution in commit messages
        entry: '(co-authored-by:|noreply@anthropic\.com|generated with .*claude|claude code)'
        language: pygrep
        args: [-i]
        stages: [commit-msg]

# Configuration: checks run at commit only; tests stay manual.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
