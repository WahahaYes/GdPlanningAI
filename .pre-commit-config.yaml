# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: fix-byte-order-marker

  # Rust formatting and linting via Makefile targets
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo fmt check (via make)
        entry: make -C addons/GdPlanningAI/rust format
        language: system
        types: [rust]
        require_serial: true
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy auto-fix (via make)
        entry: make -C addons/GdPlanningAI/rust lint-fix
        language: system
        types: [rust]
        require_serial: true
        pass_filenames: false

      - id: cargo-clippy-check
        name: Cargo clippy check (errors block, warnings pass)
        entry: make -C addons/GdPlanningAI/rust lint
        language: system
        types: [rust]
        require_serial: true
        pass_filenames: false

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
        verbose: true

  # Python formatting/linting for scripts
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: ["--fix"]
        types: [python]
      - id: ruff-format
        types: [python]

  # GDScript formatting and style checks via Makefile
  - repo: local
    hooks:
      - id: gdformat
        name: GDScript format (via make)
        entry: make format-godot
        language: system
        types: [gdscript]
        require_serial: true
        pass_filenames: false

      - id: gdlint-style
        name: GDScript/Rust style check (via make)
        entry: make lint-style
        language: system
        types_or: [gdscript, rust]
        require_serial: true
        pass_filenames: false

# Configuration
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
