# Coverage is a signal, never a gate: no status blocks a merge. Flags come from build.yml:
# rust-tests from the rust job, behavioral from the godot Linux leg. Carryforward keeps a flag
# when a PR skips that job (only docs or only Rust changed).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false
flag_management:
  default_rules:
    carryforward: true
