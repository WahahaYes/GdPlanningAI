# Coverage is a signal, never a gate: no status blocks a merge. Flags come from build.yml's
# coverage job (rust-tests, behavioral); carryforward keeps a flag when a PR skips the job.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: false
flag_management:
  default_rules:
    carryforward: true
