[package]
name = "gdplanningai-rust"
# Not the release version (that is addons/GdPlanningAI/plugin.cfg). Fixed on purpose: a release
# bump here would change the rust/ tree id and stale the binaries stamp (scripts/binaries.sh).
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
godot = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"

[build-dependencies]
godot-bindings = "0.4.5"

[profile.release]
strip = true
