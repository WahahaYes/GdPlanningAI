[package]
name = "gdplanningai-rust"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
godot = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.8"

[dev-dependencies]
libtest-mimic = "0.8"
toml = "1.1"

# Planner scenarios from tests/scenarios/*.toml, one test per case.
[[test]]
name = "scenarios"
harness = false

[build-dependencies]
godot-bindings = "0.4.5"

[profile.release]
strip = true
