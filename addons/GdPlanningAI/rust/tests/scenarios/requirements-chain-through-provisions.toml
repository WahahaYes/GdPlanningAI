[[case]]
name = "requirement_provision_chains_pickup_then_eat"
agent = { hunger = 80 }
objects = [{ uid = "food_01", groups = ["food"] }]
actions = [
  { name = "pickup", cost = 5.0, provides = [{ binding = "held_item", value = { object = 101 } }] },
  { name = "eat", cost = 5.0, effect = { add = { hunger = -60 } }, requires = [{ binding_exists = "held_item" }] },
]
goals = [{ name = "satisfy_hunger", reward = 10.0, want = [{ agent = "hunger", op = "<", value = 30 }] }]
expect = { plan = ["pickup", "eat"] }

# go_to's wildcard binds at_target to the object interact requires, for both of them.
[[case]]
name = "wildcard_fact_provision_binds_concrete_value"
agent = { goal_met = false }
objects = [{ uid = "obj_01" }]
actions = [
  { name = "go_to", effect = { set = { goal_met = true } }, provides = [{ fact_wildcard = "at_target" }] },
  { name = "interact", effect = { set = { goal_met = true } }, requires = [{ fact = "at_target", args = [{ object = 100 }] }] },
]
goals = [{ name = "reach_and_use", reward = 10.0, want = [{ agent = "goal_met", op = "==", value = true }] }]

[case.expect]
plan = ["go_to", "interact"]
bindings = [
  { at = 0, name = "at_target", values = [{ object = 100 }] },
  { at = 1, name = "at_target", values = [{ object = 100 }] },
]

# The agent holds a tool; eat needs a held item in the food group, so pickup_food comes first.
# Object uids match the ObjectRef ids as strings.
[[case]]
name = "binding_in_set_respects_world_group"
agent = { hunger = 80, held_item = { object = 102 } }
objects = [{ uid = "101", groups = ["food"] }, { uid = "102", groups = ["tool"] }]
actions = [
  { name = "pickup_food", cost = 5.0, provides = [{ binding = "held_item", value = { object = 101 } }] },
  { name = "eat", cost = 5.0, effect = { add = { hunger = -60 } }, requires = [{ binding_in_set = "held_item", set = "food" }] },
]
goals = [{ name = "satisfy_hunger", reward = 10.0, want = [{ agent = "hunger", op = "<", value = 30 }] }]
expect = { plan = ["pickup_food", "eat"] }

# The agent already holds an item, so eating needs no pickup. The scheduler derives initial
# provisions from agent properties, so the fixture states both.
[[case]]
name = "initial_provision_satisfies_requirement"
agent = { hunger = 80, held_item = { object = 101 } }
provisions = [{ binding = "held_item", value = { object = 101 } }]
actions = [
  { name = "pickup", cost = 5.0, provides = [{ binding = "held_item", value = { object = 101 } }] },
  { name = "eat", cost = 5.0, effect = { add = { hunger = -60 } }, requires = [{ binding_exists = "held_item" }] },
]
goals = [{ name = "satisfy_hunger", reward = 10.0, want = [{ agent = "hunger", op = "<", value = 30 }] }]
expect = { plan = ["eat"], cost = 5.0 }

# A concrete fact provision meets an identical fact requirement and binds its args; here the
# pickup also tags the item as food, as the Inventory to Consumption pattern does.
[[case]]
name = "fact_provision_satisfies_identical_requirement"
agent = { hunger = 80 }
actions = [
  { name = "pickup", cost = 5.0, provides = [{ fact = "is_food", args = [{ object = 101 }] }] },
  { name = "eat", cost = 5.0, effect = { add = { hunger = -60 } }, requires = [{ fact = "is_food", args = [{ object = 101 }] }] },
]
goals = [{ name = "satisfy_hunger", reward = 10.0, want = [{ agent = "hunger", op = "<", value = 30 }] }]

[case.expect]
plan = ["pickup", "eat"]
bindings = [{ at = 0, name = "is_food", values = [{ object = 101 }] }]

# One wildcard go_to serves two different at_target needs. Each copy goes right before the action
# that needs it, not at the front of the chain.
[[case]]
name = "each_go_to_runs_right_before_its_consumer"
agent = { held_item = "", dropped = false }
objects = [{ uid = "100", properties = { position = 1 } }, { uid = "200", properties = { position = 2 } }]
actions = [
  { name = "use", cost = 1.0, effect = { set = { dropped = true, held_item = "" } }, requires = [{ binding_equals = "held_item", value = "wood" }, { fact = "at_target", args = [{ object = 200 }] }] },
  { name = "pickup", cost = 1.0, effect = { set = { held_item = "wood" } }, requires = [{ fact = "at_target", args = [{ object = 100 }] }], provides = [{ binding = "held_item", value = "wood" }] },
  { name = "go_to", cost = 5.0, effect = { set = { at_location = true } }, provides = [{ fact_wildcard = "at_target" }] },
]
goals = [{ name = "dropped", reward = 100.0, want = [{ agent = "dropped", op = "==", value = true }] }]

[case.expect]
plan = ["go_to", "pickup", "go_to", "use"]
bindings = [{ at = 0, name = "at_target", values = [{ object = 100 }] }, { at = 2, name = "at_target", values = [{ object = 200 }] }]
