# quick meets the goal for 1; slow1 then slow2 meets it for 5.
[[case]]
name = "best_cost_returns_lowest_cost_plan"
actions = [
  { name = "quick", cost = 1.0, effect = { set = { goal_met = true } } },
  { name = "slow1", cost = 2.0, effect = { set = { can_finish = true } } },
  { name = "slow2", cost = 3.0, effect = { set = { goal_met = true } }, preconditions = [{ agent = "can_finish", op = "==", value = true }] },
]
goals = [{ name = "finish", reward = 10.0, want = [{ agent = "goal_met", op = "==", value = true }] }]
expect = { plan = ["quick"], cost = 1.0 }

# FirstComplete returns the first plan to finish verification, not the cheapest: a one-step plan
# verifies without a callback, while a longer one waits on its effects. Here they coincide.
[[case]]
name = "first_complete_returns_first_found_plan"
first_complete = true
actions = [
  { name = "quick", cost = 1.0, effect = { set = { goal_met = true } } },
  { name = "slow1", cost = 2.0, effect = { set = { can_finish = true } } },
  { name = "slow2", cost = 3.0, effect = { set = { goal_met = true } }, preconditions = [{ agent = "can_finish", op = "==", value = true }] },
]
goals = [{ name = "finish", reward = 10.0, want = [{ agent = "goal_met", op = "==", value = true }] }]
expect = { plan = ["quick"], cost = 1.0 }

# The cheaper plan is the longer one: direct meets the goal for 10, get_food then light_fire for 2.
[[case]]
name = "cheaper_longer_chain_beats_an_expensive_direct_action"
agent = { has_food = false, has_fire = false }
actions = [
  { name = "direct", cost = 10.0, effect = { set = { has_food = true, has_fire = true } } },
  { name = "get_food", cost = 1.0, effect = { set = { has_food = true } } },
  { name = "light_fire", cost = 1.0, effect = { set = { has_fire = true } } },
]
goals = [{ name = "meal", reward = 100.0, want = [{ agent = "has_food", op = "==", value = true }, { agent = "has_fire", op = "==", value = true }] }]
expect = { cost = 2.0 }
