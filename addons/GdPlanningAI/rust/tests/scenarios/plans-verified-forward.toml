[[case]]
name = "single_step_chain_verifies_and_completes"
first_complete = true
agent = { goal_met = false }
actions = [{ name = "finish", effect = { set = { goal_met = true } } }]
goals = [{ name = "goal", reward = 10.0, want = [{ agent = "goal_met", op = "==", value = true }] }]
expect = { plan = ["finish"] }

# heal's own effect would meet its precondition; that must not count.
[[case]]
name = "action_cannot_satisfy_its_own_precondition"
agent = { health = 0 }
actions = [{ name = "heal", effect = { set = { health = 10 } }, preconditions = [{ agent = "health", op = ">", value = 0 }] }]
goals = [{ name = "recover", reward = 10.0, want = [{ agent = "health", op = ">", value = 5 }] }]
expect = { fails = true }

# The only held_item provider binds a weapon; eat needs food.
[[case]]
name = "binding_in_set_rejected_during_forward_validation"
agent = { hunger = 80 }
objects = [{ uid = "101", groups = ["food"] }, { uid = "102", groups = ["weapon"] }]
actions = [
  { name = "pickup_sword", provides = [{ binding = "held_item", value = { object = 102 } }] },
  { name = "eat", cost = 5.0, effect = { add = { hunger = -60 } }, requires = [{ binding_in_set = "held_item", set = "food" }] },
]
goals = [{ name = "satisfy_hunger", reward = 10.0, want = [{ agent = "hunger", op = "<", value = 30 }] }]
expect = { fails = true }

# Eating needs the agent at the food and holding food (both built-in). Walking to the food drops
# the item and picking up walks home, so [pickup, goto_food, eat] meets each need once and fails
# when replayed.
[[case]]
name = "builtin_precondition_broken_by_a_later_step_is_rejected"
agent = { pos = 0, held = 0 }
actions = [
  { name = "goto_food", cost = 1.0, effect = { set = { pos = 1, held = 0 } } },
  { name = "pickup", cost = 1.0, effect = { set = { pos = 0, held = 1 } } },
  { name = "eat", cost = 1.0, effect = { set = { fed = 1, held = 0 } }, preconditions = [
    { agent = "pos", op = "==", value = 1 },
    { agent = "held", op = "==", value = 1 },
  ] },
]
goals = [{ name = "fed", reward = 10.0, want = [{ agent = "fed", op = "==", value = 1 }] }]
expect = { fails = true }

# Go To provides at_target for any object while planning; replaying checks the agent's position
# against the target's. This Go To never moves the agent, so only a target it already stands on
# verifies.
[[case]]
name = "target_already_reached_verifies"
agent_objects = [{ uid = "me", groups = ["GdPAILocationData"], properties = { position = 5 } }]
objects = [{ uid = "100", properties = { position = 5 } }]
actions = [
  { name = "go_to", provides = [{ fact_wildcard = "at_target" }] },
  { name = "use", effect = { set = { done = true } }, requires = [{ fact = "at_target", args = [{ object = 100 }] }] },
]
goals = [{ name = "use", reward = 10.0, want = [{ agent = "done", op = "==", value = true }] }]
expect = { plan = ["go_to", "use"] }

[[case]]
name = "unreached_target_is_rejected"
agent_objects = [{ uid = "me", groups = ["GdPAILocationData"], properties = { position = 0 } }]
objects = [{ uid = "100", properties = { position = 5 } }]
actions = [
  { name = "go_to", provides = [{ fact_wildcard = "at_target" }] },
  { name = "use", effect = { set = { done = true } }, requires = [{ fact = "at_target", args = [{ object = 100 }] }] },
]
goals = [{ name = "use", reward = 10.0, want = [{ agent = "done", op = "==", value = true }] }]
expect = { fails = true }
